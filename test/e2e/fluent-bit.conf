[SERVICE]
    Flush         1
    Daemon        off
    Log_Level     info
    Plugins_File  /fluent-bit/plugins/plugins.conf

[INPUT]
    Name    dummy
    Tag     e2e.dummy
    Dummy   {"message":"e2e-marker-record","level":"info"}
    Rate    1

[OUTPUT]
    Name          amqp
    Match         e2e.*
    url           ${RABBITMQ_URL}
    queue         e2e-events
    routing_key   e2e-events
    cloudevents   false
    durable       true
