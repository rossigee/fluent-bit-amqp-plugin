# Test-only RabbitMQ configuration for the TLS integration tests.
# Used by run-tls-integration.sh, which mounts the generated certificates at /certs.
# Clients must present a certificate signed by the test CA (mutual TLS).

listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile = /certs/server.pem
ssl_options.keyfile = /certs/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
