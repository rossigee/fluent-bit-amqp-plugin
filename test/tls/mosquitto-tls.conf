# Test-only Mosquitto configuration for the MQTTS integration tests.
# Used by run-tls-integration.sh, which mounts the generated certificates at /certs.
# Clients must present a certificate signed by the test CA (mutual TLS).
listener 8883
cafile /certs/ca.pem
certfile /certs/server.pem
keyfile /certs/server.key
require_certificate true
allow_anonymous true
persistence false
